name: Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          npm run build
          Set-Location ..
      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller
      - name: Download runtime binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/runtime/bin | Out-Null
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "build/runtime/bin/yt-dlp.exe"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile "build/ffmpeg.zip"
          Expand-Archive "build/ffmpeg.zip" -DestinationPath "build/ffmpeg" -Force
          $ffmpeg = Get-ChildItem "build/ffmpeg" -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          if (-not $ffmpeg) { throw "FFmpeg binary was not found." }
          Copy-Item $ffmpeg.FullName "build/runtime/bin/ffmpeg.exe" -Force
          Invoke-WebRequest -Uri "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile "build/deno.zip"
          Expand-Archive "build/deno.zip" -DestinationPath "build/deno" -Force
          $deno = Get-ChildItem "build/deno" -Filter deno.exe -Recurse | Select-Object -First 1
          if (-not $deno) { throw "Deno binary was not found." }
          Copy-Item $deno.FullName "build/runtime/bin/deno.exe" -Force
      - name: Build EXE with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name yt-dlp-webui --paths backend --add-data "backend/static;backend/static" --add-data "config;config" --hidden-import routers.config_router --hidden-import routers.tasks --hidden-import routers.websocket --hidden-import routers.yt_dlp windows/launcher.py
          Copy-Item "build/runtime/bin" "dist/yt-dlp-webui/bin" -Recurse -Force
      - name: Compile installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc "windows/installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packaged files
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/yt-dlp-webui/yt-dlp-webui.exe")) { throw "Application EXE missing." }
          if (-not (Test-Path "dist/yt-dlp-webui/bin/yt-dlp.exe")) { throw "yt-dlp missing." }
          if (-not (Test-Path "dist/yt-dlp-webui/bin/ffmpeg.exe")) { throw "FFmpeg missing." }
          if (-not (Test-Path "dist/yt-dlp-webui/bin/deno.exe")) { throw "Deno missing." }
          if (-not (Test-Path "windows/installer/yt-dlp-webui-setup.exe")) { throw "Installer missing." }
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: yt-dlp-webui-windows
          path: |
            dist/yt-dlp-webui/**
            windows/installer/yt-dlp-webui-setup.exe
          retention-days: 30
